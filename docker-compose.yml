services:
  postgres:
    image: postgres:16
    container_name: postgresTarea
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgresUser
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: bdTareaPostgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: